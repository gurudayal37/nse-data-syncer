name: Daily Stock Sync (Remaining)

on:
  schedule:
    - cron: '0 11 * * 1-5'  # Runs at 4:30 PM IST (11:00 AM UTC) Mon-Fri
  workflow_dispatch:  # Allows manual trigger

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run sync (Remaining Stocks)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.main --source remaining
      
      - name: Log completion
        run: echo "Data sync for remaining stocks completed at $(date)"
