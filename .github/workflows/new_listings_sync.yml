name: Daily New Listings Sync

on:
  schedule:
    - cron: '40 10 * * 1-5'  # Runs at 4:10 PM IST (10:40 AM UTC) Mon-Fri, offset from SME sync
  workflow_dispatch:  # Allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-new-listings:
    runs-on: ubuntu-latest
    environment: dhan-sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover & Backfill New Mainboard Listings (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python scripts/sync_new_listings.py

      - name: Log completion
        run: echo "New listings sync completed at $(date)"
