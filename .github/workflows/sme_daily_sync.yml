name: Daily SME Sync

on:
  schedule:
    - cron: '30 10 * * 1-5'  # Runs at 4:00 PM IST (10:30 AM UTC) Mon-Fri
  workflow_dispatch:  # Allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-sme-data:
    runs-on: ubuntu-latest
    environment: dhan-sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync SME Stock Data (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python scripts/sync_sme_stocks.py

      - name: Log completion
        run: echo "SME data sync completed at $(date)"
