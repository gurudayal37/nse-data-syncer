name: Optimized Daily Sync

on:
  schedule:
    - cron: '0 10 * * 1-5' # Runs at 3:30 PM IST (10:00 AM UTC) Mon-Fri
  workflow_dispatch:  # Manual trigger for now

jobs:
  # 1. Parallel Sync (5 Shards)
  sync-shards:
    name: Sync Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4] # 5 Parallel Jobs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Sync Shard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.main --shard-index ${{ matrix.shard }} --total-shards 5 --skip-momentum

  # 2. Momentum Calculation (Runs after ALL shards finish)
  calculate-momentum:
    needs: sync-remaining
    runs-on: ubuntu-latest
    name: Calculate Momentum
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
            
      - name: Run Momentum Calculation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.momentum

  # 3. strategies (Runs AFTER Calculate Momentum)
  update-ath-strategy:
    needs: calculate-momentum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ATH Strategy Backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_ath_strategy.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update ATH strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_ath.json"

  update-momentum-strategy:
    needs: update-ath-strategy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Momentum Strategy Backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_momentum.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update momentum strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results.json"

  update-momentum-weekly:
    needs: update-momentum-strategy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Weekly Momentum Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_momentum_weekly.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Weekly Momentum Strategy Backtest Results"
          file_pattern: "web/src/data/backtest_results_weekly.json"

  update-simple-momentum:
    needs: update-momentum-weekly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple.json"

  update-simple-momentum-all-nifty:
    needs: update-simple-momentum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum Strategy (All Nifty)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum_all_nifty.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum (all nifty) strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple_all_nifty.json"

  update-simple-weekly:
    needs: update-simple-momentum-all-nifty
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum Weekly Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum_weekly.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum weekly strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple_weekly.json"

  # 4. Sync Remaining Stocks (Runs AFTER Calculation too? Or in parallel with shards?)
  # User asked to "include" it. Usually this is sync. But 'calculate-momentum' might need these prices.
  # So safest is: Run PARALLEL to shards, and momentum DEPENDS on it.
  sync-remaining:
    needs: sync-shards
    name: Sync Remaining Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4] # 5 Parallel Jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Sync (Remaining) - Shard ${{ matrix.shard }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.main --source remaining --shard-index ${{ matrix.shard }} --total-shards 5 --skip-momentum
