name: Optimized Daily Sync

on:
  # No native schedule trigger: GitHub's cron queue was delaying runs by 2-5+ hours.
  # Triggered instead by an external cron-job.org job hitting /api/cron/trigger-sync
  # at 3:40 PM IST, which calls this workflow's dispatch API directly.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIN_MARKET_CAP_CR: ${{ vars.MIN_MARKET_CAP_CR }}

jobs:
  # 1. Parallel Sync (5 Shards)
  sync-shards:
    name: Sync Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4] # 5 Parallel Jobs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Shard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.main --shard-index ${{ matrix.shard }} --total-shards 5 --skip-momentum

  # 4. Sync Remaining Stocks
  sync-remaining:
    needs: sync-shards
    name: Sync Remaining Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4] # 5 Parallel Jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Remaining
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.main --source remaining --shard-index ${{ matrix.shard }} --total-shards 5 --skip-momentum

  # 2. Momentum Calculation (Runs after ALL shards finish)
  calculate-momentum:
    needs: sync-remaining
    runs-on: ubuntu-latest
    name: Calculate Momentum

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Momentum Calculation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.momentum

  generate-strategy-picks:
    needs: calculate-momentum
    runs-on: ubuntu-latest
    name: Generate Next-Month Strategy Picks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Strategy Picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/generate_strategy_picks.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update strategy picks [skip ci]"
          file_pattern: "web/src/data/strategy_picks.json"

  check-stop-losses:
    needs: generate-strategy-picks
    runs-on: ubuntu-latest
    name: Check Stop-Loss Alerts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Stop Losses
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_stop_losses.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stop-loss alerts [skip ci]"
          file_pattern: "web/src/data/stop_alerts.json"

  update-adr:
    needs: check-stop-losses
    runs-on: ubuntu-latest
    name: Calculate ADR%
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ADR% Calculation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/calculate_adr.py

  # 3. Active strategies (paused strategies removed from CI — data is frozen)
  update-momentum-strategy:
    needs: update-adr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Momentum Strategy Backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_momentum.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update momentum strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results.json"

  update-simple-momentum:
    needs: update-momentum-strategy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple.json"

  update-simple-momentum-all-nifty:
    needs: update-simple-momentum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum Strategy (All Nifty)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum_all_nifty.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum (all nifty) strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple_all_nifty.json"

  update-momentum-10pct-stop:
    needs: update-simple-momentum-all-nifty
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Momentum + 10% Stop Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_momentum_10pct_stop.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update momentum 10pct stop strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_10pct_stop.json"

  update-simple-momentum-10pct-stop:
    needs: update-momentum-10pct-stop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum (Nifty) + 10% Stop Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum_10pct_stop.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum 10pct stop strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple_10pct_stop.json"

  update-simple-momentum-all-nifty-10pct-stop:
    needs: update-simple-momentum-10pct-stop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Simple Momentum (High Cap) + 10% Stop Strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backtest_simple_momentum_all_nifty_10pct_stop.py
      - run: git pull origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum all nifty 10pct stop strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple_all_nifty_10pct_stop.json"

  update-vcp-strategy:
    needs: update-simple-momentum-all-nifty-10pct-stop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run VCP Analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/calculate_vcp.py

  update-stage2-strategy:
    needs: update-vcp-strategy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Stage 2 Analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/calculate_stage2.py

  update-swing-score:
    needs: update-stage2-strategy
    runs-on: ubuntu-latest
    name: Calculate Swing Score
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Swing Score Calculation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/calculate_swing_score.py

  update-market-breadth:
    needs: update-swing-score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Calculate Market Breadth
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/calculate_market_breadth.py
