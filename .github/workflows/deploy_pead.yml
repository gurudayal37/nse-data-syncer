name: Deploy PEAD Lambdas

on:
  push:
    branches: [main]
    paths:
      - 'aws/pead/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Package & deploy both Lambda functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Build shared package layer ──────────────────────────────────────────
      - name: Install Lambda dependencies
        run: |
          pip install \
            --target aws/pead/package \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            -r aws/pead/requirements.txt

      # ── Deploy pead-poller ─────────────────────────────────────────────────
      - name: Package pead-poller
        run: |
          cd aws/pead
          cp poller.py package/
          cd package && zip -r ../poller.zip . -x "*.pyc" -x "__pycache__/*"
          cd ..
          rm package/poller.py

      - name: Deploy pead-poller
        run: |
          aws lambda update-function-code \
            --function-name pead-poller \
            --zip-file fileb://aws/pead/poller.zip \
            --region ap-south-1

          aws lambda wait function-updated \
            --function-name pead-poller \
            --region ap-south-1

          aws lambda update-function-configuration \
            --function-name pead-poller \
            --environment "Variables={
              DATABASE_URL=${{ secrets.PEAD_DATABASE_URL }},
              TELEGRAM_BOT_TOKEN=${{ secrets.PEAD_TELEGRAM_BOT_TOKEN }},
              TELEGRAM_CHAT_ID=${{ secrets.PEAD_TELEGRAM_CHAT_ID }},
              SQS_QUEUE_URL=${{ secrets.PEAD_SQS_QUEUE_URL }},
              GH_PAT=${{ secrets.GH_PAT }}
            }" \
            --region ap-south-1

      # ── Deploy pead-processor ──────────────────────────────────────────────
      - name: Package pead-processor
        run: |
          cd aws/pead
          cp processor.py package/
          cd package && zip -r ../processor.zip . -x "*.pyc" -x "__pycache__/*"
          cd ..
          rm package/processor.py

      - name: Deploy pead-processor
        run: |
          aws lambda update-function-code \
            --function-name pead-processor \
            --zip-file fileb://aws/pead/processor.zip \
            --region ap-south-1

          aws lambda wait function-updated \
            --function-name pead-processor \
            --region ap-south-1

          aws lambda update-function-configuration \
            --function-name pead-processor \
            --environment "Variables={
              DATABASE_URL=${{ secrets.PEAD_DATABASE_URL }},
              TELEGRAM_BOT_TOKEN=${{ secrets.PEAD_TELEGRAM_BOT_TOKEN }},
              TELEGRAM_CHAT_ID=${{ secrets.PEAD_TELEGRAM_CHAT_ID }},
              ANTHROPIC_API_KEY=${{ secrets.PEAD_ANTHROPIC_API_KEY }},
              SCREENER_USERNAME=${{ secrets.PEAD_SCREENER_USERNAME }},
              SCREENER_PASSWORD=${{ secrets.PEAD_SCREENER_PASSWORD }}
            }" \
            --region ap-south-1

      - name: Verify deployment
        run: |
          echo "=== pead-poller ==="
          aws lambda get-function --function-name pead-poller \
            --query 'Configuration.{State:State,LastModified:LastModified}' \
            --region ap-south-1

          echo "=== pead-processor ==="
          aws lambda get-function --function-name pead-processor \
            --query 'Configuration.{State:State,LastModified:LastModified}' \
            --region ap-south-1
