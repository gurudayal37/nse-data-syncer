name: Weekly Momentum Strategy Backtest

on:
  schedule:
    # Run daily at 10:45 UTC (after daily sync at 10:00 and momentum strategy at 10:15)
    - cron: '45 10 * * *'
  workflow_dispatch:

jobs:
  weekly-momentum-backtest:
    runs-on: ubantu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Momentum Backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/backtest_momentum_weekly.py

      - name: Commit Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Weekly Momentum Strategy Backtest Results"
          file_pattern: 'web/src/data/backtest_results_weekly.json'
