name: Daily Dhan Sync

on:
  schedule:
    - cron: '30 10 * * 1-5'  # Runs at 4:00 PM IST (10:30 AM UTC) Mon-Fri
  workflow_dispatch:  # Allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-dhan-data:
    runs-on: ubuntu-latest
    environment: dhan-sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # One Dhan TOTP login for the whole job, reused by every sync step below
      # via DHAN_TOKEN_FILE (each script falls back to minting its own if
      # that's unset, for standalone/manual runs). Previously each script
      # minted its own login as a sequential step, on the assumption every
      # script takes "several minutes" so no two logins land in the same TOTP
      # window - that broke the day a step finished quickly and the next
      # step's login landed too close behind it, which Dhan rejects outright
      # with "Invalid TOTP" (not just a rate-limit). Minting once removes the
      # whole class of collision instead of relying on runtime spacing.
      #
      # The token is written straight to a file on the runner's ephemeral
      # disk (wiped with the rest of the workspace when the job ends) - never
      # printed, never a step output. This is a public repo and a live,
      # full-access credential for a real brokerage account, so it must never
      # touch anything that ends up in Actions logs.
      - name: Generate Dhan Access Token
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: python scripts/generate_dhan_token.py --out "$RUNNER_TEMP/dhan_token"

      - name: Sync Index Data (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_TOKEN_FILE: ${{ runner.temp }}/dhan_token
        run: |
          python scripts/sync_dhan_indices.py

      - name: Sync SME Stock Data (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_TOKEN_FILE: ${{ runner.temp }}/dhan_token
        run: |
          python scripts/sync_sme_stocks.py

      - name: Discover & Backfill New Mainboard Listings (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_TOKEN_FILE: ${{ runner.temp }}/dhan_token
        run: |
          python scripts/sync_new_listings.py

      - name: Sync ETF Data (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_TOKEN_FILE: ${{ runner.temp }}/dhan_token
        run: |
          python scripts/sync_etf_daily.py

      # No Dhan login here - reads only from etf_daily_prices, already fresh
      # from the step above. Just needs the DB connection.
      - name: Compute ETF Live Strategy Picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/compute_etf_live_strategy.py

      - name: Log completion
        run: echo "Dhan data sync (index, SME, new listings, ETFs, live strategy picks) completed at $(date)"
