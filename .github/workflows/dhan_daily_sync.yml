name: Daily Dhan Sync

on:
  schedule:
    - cron: '30 10 * * 1-5'  # Runs at 4:00 PM IST (10:30 AM UTC) Mon-Fri
  workflow_dispatch:  # Allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-dhan-data:
    runs-on: ubuntu-latest
    environment: dhan-sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # These three scripts each mint their own Dhan TOTP login. Running them as
      # sequential steps in one job (rather than separate scheduled workflows)
      # is what actually fixes the token collision: each script runs to full
      # completion - several minutes of real sync work - before the next one
      # logs in, so no two logins land in the same TOTP window regardless of
      # GitHub's cron queue drift (previously observed causing collisions even
      # with a 5min schedule gap between separate workflows).
      - name: Sync Index Data (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python scripts/sync_dhan_indices.py

      - name: Sync SME Stock Data (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python scripts/sync_sme_stocks.py

      - name: Discover & Backfill New Mainboard Listings (Dhan)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python scripts/sync_new_listings.py

      - name: Log completion
        run: echo "Dhan data sync (index, SME, new listings) completed at $(date)"
