name: Resync Single Stock

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'NSE symbol to resync (e.g. TATAINVEST)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resync:
    name: Resync ${{ inputs.symbol }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted resync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.main --symbols ${{ inputs.symbol }} --skip-momentum
