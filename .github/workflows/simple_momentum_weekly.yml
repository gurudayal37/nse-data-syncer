name: Update Simple Momentum Weekly Strategy

on:
  schedule:
    - cron: '30 11 * * 1-5'  # Runs at 5:00 PM IST (11:30 AM UTC) Mon-Fri
  workflow_dispatch:  # Allows manual trigger

jobs:
  update-simple-weekly-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write permission to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backtest & Strategy Update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/backtest_simple_momentum_weekly.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update simple momentum weekly strategy results [skip ci]"
          file_pattern: "web/src/data/backtest_results_simple_weekly.json"
