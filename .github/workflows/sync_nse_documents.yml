name: Sync NSE Documents

on:
  schedule:
    - cron: '30 14 * * *'     # 20:00 IST every day including Sunday
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date YYYY-MM-DD (leave blank for yesterday)'
        required: false
        type: string
      to_date:
        description: 'End date YYYY-MM-DD (leave blank for today)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Sync NSE Documents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync NSE documents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            ARGS="$ARGS --from ${{ github.event.inputs.from_date }}"
          fi
          if [ -n "${{ github.event.inputs.to_date }}" ]; then
            ARGS="$ARGS --to ${{ github.event.inputs.to_date }}"
          fi
          python scripts/sync_nse_documents.py $ARGS
