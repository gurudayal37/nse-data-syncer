name: Daily Index Sync

on:
  schedule:
    - cron: '30 10 * * 1-5'  # Runs at 4:00 PM IST (10:30 AM UTC) Mon-Fri
  workflow_dispatch:  # Allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-index-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Sync Index Data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/sync_index_daily.py
      
      - name: Log completion
        run: echo "Index data sync completed at $(date)"
