name: Fix Volume Column Migration

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/fix_volume_column.py
      
      - name: Log completion
        run: echo "Migration completed at $(date)"
